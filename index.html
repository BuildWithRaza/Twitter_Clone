<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home / X</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-black text-white">
    <main class="flex">
        <section class="w-[25%] flex flex-col justify-between h-screen">
            <div class=" flex flex-col gap-2 py-5">
                <div class="logo flex justify-end">
                    <div class="w-[75%] p-3">
                        <img class="invert w-[30px]" src="./Assets/svg/logo.svg" alt="">
                    </div>
                </div>
                <div class="sidebar flex flex-col items-end">
                    <ul class="w-[75%] font-semibold  flex flex-col  text-[20px]">

                        <li class="flex items-center gap-6 leading-6 p-3 rounded-3xl hover:bg-[#181818] w-fit">
                            <img class="invert w-6" src="./Assets/svg/home.svg" alt="">
                            <a href="/">Home</a>
                        </li>
                        <li class="flex items-center gap-6 leading-6 p-3 rounded-3xl hover:bg-[#181818] w-fit">
                            <span class="material-symbols-outlined text-[24px]">search</span>
                            <a href="/">Explore</a>
                        </li>
                        <li class="flex items-center gap-6 leading-6 p-3 rounded-3xl hover:bg-[#181818] w-fit">
                            <img class="invert w-6" src="./Assets/svg/notification.svg" alt="">
                            <a href="/">Notification</a>
                        </li>
                        <li class="flex items-center gap-6 leading-6 p-3 rounded-3xl hover:bg-[#181818] w-fit">
                            <span class="material-symbols-outlined text-[24px] ">person_add</span>
                            <a href="/">Follow</a>
                        </li>
                        <li class="flex items-center gap-6 leading-6 p-3 rounded-3xl hover:bg-[#181818] w-fit">
                            <img class="invert w-6" src="./Assets/svg/chat.svg" alt="">
                           <a href="/">Chat</a>
                        </li>
                        <li class="flex items-center gap-6 leading-6 p-3 rounded-3xl hover:bg-[#181818] w-fit">
                            <img class="invert w-6" src="./Assets/svg/grok.svg" alt="">
                           <a href="/">Grok</a>
                        </li>
                        <li class="flex items-center gap-6 leading-6 p-3 rounded-3xl hover:bg-[#181818] w-fit">
                            <span class="material-symbols-outlined text-[24px] ">bookmark</span>
                            <a href="/">History</a>
                        </li>
                        <li class="flex items-center gap-6 leading-6 p-3 rounded-3xl hover:bg-[#181818] w-fit">
                            <img class="invert w-6" src="./Assets/svg/premium.svg" alt="">
                            <a href="/">Premium</a>
                        </li>
                        <li class="flex items-center gap-6 leading-6 p-3 rounded-3xl hover:bg-[#181818] w-fit">
                            <span class="material-symbols-outlined text-[24px] ">person</span>
                            <a href="/">Profile</a>
                        </li>
                        <li class="flex items-center gap-6 leading-6 p-3 rounded-3xl hover:bg-[#181818] w-fit">
                            <img class="invert w-6" src="./Assets/svg/more.svg" alt="">
                            <a href="/">More</a>
                        </li>

                    </ul>

                </div>
                <div class="postButton flex justify-end w-[70%] mx-auto font-semibold text-[17px]">
                    <button class="w-[85%] p-3 bg-white text-black rounded-3xl px-8">Post</button>
                </div>
            </div>
            <div class="flex justify-end w-[75%] items-end ml-auto mr-3">
                <div
                    class="shortProfile flex justify-between items-center w-[100%]  hover:bg-[#181818] p-3 rounded-full mb-3">
                    <div class="flex gap-4">
                        <div class="image">
                            <img class=" w-12 rounded-full" src="./Assets/Images/person.png" alt="">
                        </div>
                        <div class="">
                            <h4>Name</h4>
                            <p class="text-[rgb(101,105,108)]">@UserName</p>
                        </div>
                    </div>
                    <div class="">
                        <img class=" w-7" src="./Assets/svg/more_hor.svg" alt="">
                    </div>
                </div>
            </div>
        </section>

        <section class="flex w-[75%]">
            <div class="first w-[60%] border-x-[.2px] border-[rgb(101,105,108)] ">a</div>
            <div class="second w-[40%]">a</div>
        </section>
    </main>
</body>

</html>
